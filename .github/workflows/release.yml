name: Release packages

# One file for both channels: npm trusted publishing is bound to this workflow's filename.
on:
  push:
    # main runs release-please; any other branch listed here publishes an experimental build.
    branches: [main, refactor/ui-system]
  # Manual runs publish whatever isn't on npm yet: recovers a dropped push event (#21) or a
  # failed publish (0.7.0); publish.ts skips versions that already exist.
  # `channel: experimental` publishes the checked-out branch instead (see the experimental job).
  workflow_dispatch:
    inputs:
      channel:
        description: latest runs the normal release; experimental publishes this branch under @experimental
        type: choice
        options: [latest, experimental]
        default: latest

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref_name == 'main' && inputs.channel != 'experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # A personal token, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN do not trigger CI, and
      # main requires CI to pass. Publishing authenticates separately, below.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.INBEAT_PACKAGES_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (https://docs.npmjs.com/trusted-publishers)
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install -g npm@latest
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: bunx turbo run typecheck test
      - if: steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        run: bun run release
        # npm tries trusted publishing (OIDC) first and falls back to this token. A trusted publisher
        # can only be added to a package that already exists on npm, so the first publish of each
        # @fieldtripagency name needs NPM_TOKEN; once every package has one, the secret can go.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  experimental:
    if: inputs.channel == 'experimental' || (github.event_name == 'push' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # Its own group, so a queued main release is never replaced by an experimental run.
    concurrency:
      group: release-experimental-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (https://docs.npmjs.com/trusted-publishers)
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck test
      # Publishes <current minor + 1>.0-experimental.<run number> under the experimental dist-tag,
      # never latest; the version is computed by publish.ts and never committed.
      - run: bun run release --tag experimental --build ${{ github.run_number }}
        # Same auth as the release job: OIDC first, NPM_TOKEN until each package has a trusted publisher.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
